<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ t("brand") }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ static("style.css") }}">
  <script defer src="{{ static("loading.js") }}"></script>
  <script defer src="{{ static("inline.js") }}"></script>
</head>
<body>
  <header class="topnav">
    <a class="brand" href="/">{{ t("brand") }}</a>
    <nav>
      <a href="/" class="{{ 'active' if request.url.path == '/' }}">{{ t("nav.dashboard") }}</a>
      <a href="/companies" class="{{ 'active' if request.url.path.startswith('/companies') or request.url.path.startswith('/discovery') }}">{{ t("nav.companies") }}</a>
      <a href="/postings" class="{{ 'active' if request.url.path.startswith('/postings') }}">{{ t("nav.postings") }}</a>
      <a href="/applications" class="{{ 'active' if request.url.path.startswith('/applications') }}">{{ t("nav.applications") }}</a>
      <a href="/profile" class="{{ 'active' if request.url.path.startswith('/profile') }}">{{ t("nav.profile") }}</a>
      <a href="/cv-builder" class="{{ 'active' if request.url.path.startswith('/cv-builder') or request.url.path.startswith('/cvs') }}">{{ t("nav.cv") }}</a>
      <a href="/preferences" class="{{ 'active' if request.url.path.startswith('/preferences') or request.url.path.startswith('/style') }}">{{ t("nav.settings") }}</a>
    </nav>
    <div class="lang-switch">
      <a href="/set-lang/en" class="{{ 'active' if lang == 'en' }}">EN</a>
      <a href="/set-lang/tr" class="{{ 'active' if lang == 'tr' }}">TR</a>
    </div>
  </header>
  <main class="content">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
